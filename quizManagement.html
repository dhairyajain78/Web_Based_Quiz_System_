<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Management - QuizMaster</title>
<link rel="stylesheet" href="style.css">
</head>
<body id="quiz-management">

<nav class="navbar">
    <div class="logo">QuizMaster</div>
    <ul class="nav-links">
        <li><a href="adminDashboard.html">Dashboard</a></li>
        <li><a href="userManagement.html">User Management</a></li>
        <li><a href="login.html">Logout</a></li>
    </ul>
    <div class="menu-toggle" id="menu-toggle">&#9776;</div>
</nav>

<section class="admin-grid-layout" id="quiz-grid-container">
    </section>

<button id="add-quiz-btn" class="btn" style="display:block; margin: 20px auto;">➕ Add New Quiz</button>

<div id="question-management-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1001; overflow-y:scroll;">
    <div class="auth-card" style="margin: 100px auto; max-width: 900px; width: 90%; padding: 30px; gap: 15px;">
        <h2 id="question-modal-title">Manage Questions for Quiz: Subject Title</h2>
        <div id="questions-edit-container">
            </div>
        <button id="add-question-btn" class="btn" style="background:#20C997;">➕ Add Question</button>
        <button id="save-questions-btn" class="btn" style="background:#0D6EFD;">💾 Save & Close</button>
        <button id="cancel-questions-btn" class="btn btn-danger" style="background:#dc3545;">Close without Saving</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
