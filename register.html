<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - QuizMaster</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-bg">

<div class="auth-section">
    <div class="auth-card">
        <h2>📝 Register</h2>
        <p>Create your account and start taking quizzes!</p>
        <input type="text" id="username" placeholder="👤 Username">
        <input type="email" id="email" placeholder="📧 Email">
        <input type="password" id="password" placeholder="🔑 Password">
        <select id="role">
            <option value="student">Student</option>
            <option value="admin">Admin</option>
        </select>
        <button id="register-btn" class="btn">Register 🎉</button>
        <p>Already have an account? <a href="login.html" style="color:#20C997; font-weight: 600;">Login here</a></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
